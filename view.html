<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>আপনার জন্য একটা letter 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <div class="stage">
    <canvas id="bg"></canvas>

    <div class="center" id="intro">
      <div class="mail" id="env" role="button" tabindex="0" aria-label="Letter খুলুন">
        <div class="mail-back"></div>
        <div class="mail-paper"><span>💌</span><i></i><i></i><i class="s"></i></div>
        <div class="mail-front"></div>
        <div class="mail-flap"></div>
        <div class="mail-label"><small id="lblTo"></small><small id="lblFrom"></small></div>
        <div class="tap" aria-hidden="true"><b>👆</b></div>
      </div>
      <div class="mail-shadow"></div>
      <p class="hint" id="hint">ট্যাপ করে খুলুন</p>
      <p class="locked" id="locked"></p>
    </div>

    <article class="letter" id="letter">
      <button class="skip" id="skip" type="button">সব দেখান</button>
      <div class="to" id="to"></div>
      <div class="body cursor" id="body"></div>
      <div class="from" id="from"></div>
      <div class="gallery" id="gallery"></div>
    </article>

    <div class="footer-cta" id="cta" style="position:absolute;bottom:44px;left:0;right:0;z-index:3">
      <a class="btn ghost" href="create.html">নিজের letter বানান 💌</a>
    </div>
    <footer class="copy fixed">© <span class="yr">2026</span> Wishes. সর্বস্বত্ব সংরক্ষিত। <button class="linkbtn" id="reportBtn" type="button" style="display:none">রিপোর্ট করুন</button></footer>
  </div>

  <div class="lightbox" id="lb"><img alt=""></div>

  <script src="js/config.js?v=3"></script>
  <script src="js/common.js?v=3"></script>
  <script src="js/view.js?v=3"></script>
  <script>document.querySelectorAll(".yr").forEach(function(e){e.textContent=new Date().getFullYear()});</script>
</body>
</html>
